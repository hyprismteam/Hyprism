version = 1
SPDX-PackageName = "Hyprism"
SPDX-PackageSupplier = "Hyprism contributors"
SPDX-PackageDownloadLocation = "https://github.com/hyprismteam/Hyprism"

[[annotations]]
path = [
    "*.json",
    "**/*.json",
    "**/*.mdx",
    "**/*.lock",
    "Docs/package-lock.json",
    "Docs/next-env.d.ts",
    "**/*.md5",
    "**/.hintrc",
    "**/*.png",
    "**/*.jpg",
    "**/*.ico",
    "**/*.icns",
    "**/*.svg",
    "Hyprism.slnx"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Hyprism Launcher"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = [
    "Sources/Hyprism.Desktop/Assets/Images/logo.svg",
    "Sources/Hyprism.Desktop/Assets/Images/banner.svg",
    "Sources/Hyprism.Desktop/Assets/Images/Hyprism.ico",
    "Packaging/macos/Hyprism.icns",
    "Sources/Hyprism.Desktop/Assets/Brands/Hyprism*"
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Hyprism Launcher"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = [
    "Sources/Hyprism.Desktop/Assets/Fonts/GoogleSans-*.ttf",
    "Docs/static/fonts/GoogleSans-*.ttf"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "Sources/Hyprism.Desktop/Assets/Fonts/JetBrainsMono-*.ttf",
    "Docs/static/fonts/JetBrainsMono-*.ttf"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "Sources/Hyprism.Desktop/Assets/Fluent/*.png"
precedence = "override"
SPDX-FileCopyrightText = "Icons8 LLC"
SPDX-License-Identifier = "LicenseRef-Icons8"

[[annotations]]
path = "Sources/Hyprism.Desktop/Assets/Flags/*.png"
precedence = "override"
SPDX-FileCopyrightText = "2020 @catamphetamine <purecatamphetamine@gmail.com>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "Sources/Hyprism.Desktop/Assets/Lotties/*.json"
precedence = "override"
SPDX-FileCopyrightText = "Lordicon"
SPDX-License-Identifier = "LicenseRef-Lordicon"

[[annotations]]
path = "Sources/Hyprism.Desktop/Assets/Brands/CurseForge*"
precedence = "override"
SPDX-FileCopyrightText = "Overwolf Ltd."
SPDX-License-Identifier = "LicenseRef-CurseForge"

[[annotations]]
path = "Sources/Hyprism.Desktop/Assets/Brands/Avalonia*"
precedence = "override"
SPDX-FileCopyrightText = "AvaloniaUI OÜ"
SPDX-License-Identifier = "LicenseRef-Avalonia"

[[annotations]]
path = "Sources/Hyprism.Desktop/Assets/Brands/DotNet*"
precedence = "override"
SPDX-FileCopyrightText = ".NET authors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "Sources/Hyprism.Desktop/Assets/Brands/YouTube*"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "LicenseRef-YouTube"
