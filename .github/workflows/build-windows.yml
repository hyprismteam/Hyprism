name: Build Windows

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_QUALITY: 'preview'

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Publish Windows x64 packages
        shell: pwsh
        run: |
          ./Packaging/publish-windows.ps1 all `
            --output dist

      - name: Test MSI and EXE shortcuts
        timeout-minutes: 10
        shell: pwsh
        run: ./Scripts/test-windows-installers.ps1 -ArtifactDirectory dist -LogDirectory "${{ runner.temp }}/hyprism-installer-tests"

      - name: Upload installer test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-test-logs
          path: ${{ runner.temp }}/hyprism-installer-tests/*.log
          if-no-files-found: ignore

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.msi
            dist/*-setup.exe
          if-no-files-found: error
