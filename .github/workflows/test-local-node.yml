name: Local Node Tests

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_QUALITY: 'preview'

jobs:
  tests:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: Windows
            runner: windows-2025
          - platform: macOS
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Run Local Node integration tests
        env:
          HYPRISM_LOCAL_NODE_SKIP_MACOS_TRUST: '1'
        run: dotnet test Tests/Hyprism.LocalNode.Tests/Hyprism.LocalNode.Tests.csproj --configuration Release --logger "trx;LogFileName=local-node-${{ matrix.platform }}.trx" --results-directory "${{ runner.temp }}/hyprism-test-results"

      - name: Publish macOS apphosts for trust smoke
        if: matrix.platform == 'macOS'
        run: |
          dotnet publish Sources/Hyprism.Desktop/Hyprism.Desktop.csproj \
            --configuration Release \
            --runtime osx-arm64 \
            --self-contained true \
            --output "$RUNNER_TEMP/hyprism-osx-arm64"
          test -x "$RUNNER_TEMP/hyprism-osx-arm64/Hyprism.Desktop"
          test -x "$RUNNER_TEMP/hyprism-osx-arm64/Hyprism.LocalNode"
          file "$RUNNER_TEMP/hyprism-osx-arm64/Hyprism.Desktop" | grep -q 'Mach-O 64-bit executable arm64'
          file "$RUNNER_TEMP/hyprism-osx-arm64/Hyprism.LocalNode" | grep -q 'Mach-O 64-bit executable arm64'

      - name: Verify trusted Local Node HTTPS
        id: macos_trust
        if: matrix.platform == 'macOS'
        run: |
          set -euo pipefail
          PORT=18443
          DATA_DIR="$RUNNER_TEMP/local-node-data"
          LOG_FILE="$RUNNER_TEMP/local-node.log"

          HYPRISM_LOCAL_NODE_SKIP_MACOS_TRUST=1 \
          "$RUNNER_TEMP/hyprism-osx-arm64/Hyprism.LocalNode" \
            --port "$PORT" \
            --data-directory "$DATA_DIR" \
            >"$LOG_FILE" 2>&1 &
          NODE_PID=$!
          trap 'kill "$NODE_PID" 2>/dev/null || true; cat "$LOG_FILE"' EXIT

          ROOT_CERTIFICATE="$DATA_DIR/hyprism-local-ca.crt"
          SERVER_CERTIFICATE="$DATA_DIR/h.localhost.crt"
          for attempt in {1..60}; do
            if [ -f "$ROOT_CERTIFICATE" ] && [ -f "$SERVER_CERTIFICATE" ]; then
              break
            fi
            sleep 0.5
          done

          test -f "$ROOT_CERTIFICATE"
          test -f "$SERVER_CERTIFICATE"
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -k /Library/Keychains/System.keychain \
            "$ROOT_CERTIFICATE"
          security verify-cert \
            -c "$SERVER_CERTIFICATE" \
            -p ssl \
            -s 127.0.0.1

          HEALTH_RESPONSE="$RUNNER_TEMP/local-node-health.json"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "https://127.0.0.1:$PORT/health" \
              --output "$HEALTH_RESPONSE"; then
              break
            fi
            sleep 0.5
          done

          test -s "$HEALTH_RESPONSE"
          grep -Fq '"status":"ready"' "$HEALTH_RESPONSE"
          grep -Fq '"server":"hyprism-local-node"' "$HEALTH_RESPONSE"
          grep -Fq "\"issuer\":\"https://127.0.0.1:$PORT\"" "$HEALTH_RESPONSE"

      - name: Write test summary
        if: always()
        shell: pwsh
        run: >
          pwsh -NoProfile -File ./Scripts/write-test-summary.ps1
          -ResultsDirectory "${{ runner.temp }}/hyprism-test-results"
          -Title "Local Node tests (${{ matrix.platform }})"

      - name: Write macOS trust smoke summary
        if: always() && matrix.platform == 'macOS'
        shell: pwsh
        env:
          SMOKE_OUTCOME: ${{ steps.macos_trust.outcome }}
          SMOKE_LOG: ${{ runner.temp }}/local-node.log
        run: |
          $lines = [System.Collections.Generic.List[string]]::new()
          [void] $lines.Add('### macOS trust and HTTPS smoke')
          [void] $lines.Add('')
          [void] $lines.Add("Status: $env:SMOKE_OUTCOME")

          if ($env:SMOKE_OUTCOME -ne 'success' -and (Test-Path -LiteralPath $env:SMOKE_LOG)) {
              $smokeOutput = (Get-Content -LiteralPath $env:SMOKE_LOG -Raw).Trim()
              if ($smokeOutput.Length -gt 16000) {
                  $smokeOutput = $smokeOutput.Substring(0, 16000) + [Environment]::NewLine + '[output truncated]'
              }

              [void] $lines.Add('')
              [void] $lines.Add('#### Last smoke output')
              [void] $lines.Add('')
              [void] $lines.Add('````text')
              [void] $lines.Add($smokeOutput)
              [void] $lines.Add('````')
          }

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (([string]::Join([Environment]::NewLine, $lines)) + [Environment]::NewLine) -Encoding utf8

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-node-test-results-${{ matrix.platform }}
          path: ${{ runner.temp }}/hyprism-test-results/*.trx
          if-no-files-found: ignore
